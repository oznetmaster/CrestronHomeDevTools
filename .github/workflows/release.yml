name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: New release version (major.minor.patch)
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    environment: release
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Verify release identity
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or $PSVersionTable.PSVersion -lt [version]'7.6') { throw 'PowerShell 7.6 or later is required. See docs/PowerShell.md.' }
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Release from main.' }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Use major.minor.patch.' }
          [xml]$props = Get-Content Directory.Build.props -Raw
          if ([version]$env:RELEASE_VERSION -le [version]$props.Project.PropertyGroup.Version) { throw 'Select a new release version.' }
          $existingTag = git tag --list "v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release tags.' }
          if ($existingTag) { throw 'Release tag already exists.' }
          if (-not '${{ vars.NUGET_USER }}') { throw 'Configure NUGET_USER and NuGet Trusted Publishing first.' }
      - name: Prepare version and release changelog locally
        run: |
          $propsPath = Join-Path $PWD 'Directory.Build.props'
          $propsText = [IO.File]::ReadAllText($propsPath)
          [IO.File]::WriteAllText($propsPath, [regex]::Replace($propsText, '<Version>[^<]+</Version>', "<Version>$env:RELEASE_VERSION</Version>"))
          $changelog = Join-Path $PWD 'CHANGELOG.md'
          $existing = [IO.File]::ReadAllText($changelog)
          $notes = [IO.File]::ReadAllText((Join-Path $PWD 'RELEASE-NOTES.md'))
          if (-not $notes.StartsWith("# CrestronHomeDevTools $env:RELEASE_VERSION")) { throw 'Release notes version mismatch.' }
          $body = $notes.Substring($notes.IndexOf("`n") + 1).Trim()
          $entry = "## $env:RELEASE_VERSION - $([DateTime]::UtcNow.ToString('yyyy-MM-dd'))`n`n$body`n`n"
          $firstBreak = $existing.IndexOf("`n")
          [IO.File]::WriteAllText($changelog, $existing.Substring(0, $firstBreak + 1) + "`n" + $entry + $existing.Substring($firstBreak + 1).TrimStart())
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Directory.Build.props CHANGELOG.md
          git commit -m "Release CrestronHomeDevTools $env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Release preparation failed.' }
      - name: Build and validate release
        run: ./tools/BuildRelease.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: artifacts/release/*
          if-no-files-found: error
      - name: Obtain short-lived NuGet credential
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish NuGet package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/release/CrestronHomeDevTools.$env:RELEASE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet publication failed.' }
      - name: Tag and publish GitHub release
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build modified tracked source.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$env:RELEASE_VERSION" -m "CrestronHomeDevTools v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed.' }
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Tag push failed.' }
          $assets = @(Get-ChildItem artifacts/release -File | Select-Object -ExpandProperty FullName)
          gh release create "v$env:RELEASE_VERSION" @assets --verify-tag --title "CrestronHomeDevTools v$env:RELEASE_VERSION" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
