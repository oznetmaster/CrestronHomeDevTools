name: Release
on:
  workflow_dispatch:
    inputs:
      skip_desktop_checks:
        description: Reuse reviewed desktop results; package integrity checks still run
        required: false
        type: boolean
        default: false
      desktop_skip_reason:
        description: Tested source, completion time, frameworks, counts and evidence
        required: false
        type: string
      validation_commit:
        description: Reuse recent CI from an ancestor SHA with only docs or release-automation changes
        required: false
        type: string
      skip_hardware_checks:
        description: Reuse reviewed processor results or record unavailable hardware
        required: false
        type: boolean
        default: false
      hardware_skip_reason:
        description: Tested source, completion time, results and cleanup or unavailability reason
        required: false
        type: string
      documentation_patch:
        description: Publish only the reviewed NuGet documentation patch; preserve existing runtime binaries and GitHub releases
        required: false
        type: boolean
        default: false
      version:
        description: New release version (major.minor.patch)
        required: true
        type: string
permissions:
  actions: read
  checks: read
  contents: write
  id-token: write
concurrency:
  group: public-release
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: inputs.documentation_patch != true
    runs-on: windows-latest
    environment: release
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Verify release identity
        run: |
          if ($PSVersionTable.PSEdition -ne 'Core' -or $PSVersionTable.PSVersion -lt [version]'7.6') { throw 'PowerShell 7.6 or later is required. See docs/PowerShell.md.' }
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Release from main.' }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Use major.minor.patch.' }
          [xml]$props = Get-Content Directory.Build.props -Raw
          if ([version]$env:RELEASE_VERSION -le [version]$props.Project.PropertyGroup.Version) { throw 'Select a new release version.' }
          $existingTag = git tag --list "v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release tags.' }
          if ($existingTag) { throw 'Release tag already exists.' }
          if (-not '${{ vars.NUGET_USER }}') { throw 'Configure NUGET_USER and NuGet Trusted Publishing first.' }
      - name: Validate explicitly reused test evidence
        if: inputs.skip_desktop_checks == true || inputs.skip_hardware_checks == true || inputs.validation_commit != ''
        uses: oznetmaster/CrestronHomeNUnit/.github/actions/release-validation@2ae8197c6685099c2133e7bb962d1f3568aae9c3
        with:
          required-checks: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          hosted-workflows: '["ci.yml","help-tests.yml"]'
          skip-desktop-checks: ${{ inputs.skip_desktop_checks }}
          desktop-skip-reason: ${{ inputs.desktop_skip_reason }}
          skip-hardware-checks: ${{ inputs.skip_hardware_checks }}
          hardware-skip-reason: ${{ inputs.hardware_skip_reason }}
          validation-commit: ${{ inputs.validation_commit }}
      - name: Prepare version and release changelog locally
        run: |
          $propsPath = Join-Path $PWD 'Directory.Build.props'
          $propsText = [IO.File]::ReadAllText($propsPath)
          [IO.File]::WriteAllText($propsPath, [regex]::Replace($propsText, '<Version>[^<]+</Version>', "<Version>$env:RELEASE_VERSION</Version>"))
          $changelog = Join-Path $PWD 'CHANGELOG.md'
          $existing = [IO.File]::ReadAllText($changelog)
          $notes = [IO.File]::ReadAllText((Join-Path $PWD 'RELEASE-NOTES.md'))
          if (-not $notes.StartsWith("# CrestronHomeDevTools $env:RELEASE_VERSION")) { throw 'Release notes version mismatch.' }
          $body = $notes.Substring($notes.IndexOf("`n") + 1).Trim()
          $entry = "## $env:RELEASE_VERSION - $([DateTime]::UtcNow.ToString('yyyy-MM-dd'))`n`n$body`n`n"
          $firstBreak = $existing.IndexOf("`n")
          [IO.File]::WriteAllText($changelog, $existing.Substring(0, $firstBreak + 1) + "`n" + $entry + $existing.Substring($firstBreak + 1).TrimStart())
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Directory.Build.props CHANGELOG.md
          git commit -m "Release CrestronHomeDevTools $env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Release preparation failed.' }
      - name: Build and validate release
        env:
          REUSE_DESKTOP: ${{ inputs.skip_desktop_checks }}
          DESKTOP_EVIDENCE: ${{ inputs.desktop_skip_reason }}
        run: ./tools/BuildRelease.ps1 -Version $env:RELEASE_VERSION -SkipDesktopTests:($env:REUSE_DESKTOP -eq 'true') -DesktopValidationEvidence $env:DESKTOP_EVIDENCE
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: artifacts/release/*
          if-no-files-found: error
      - name: Obtain short-lived NuGet credential
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          foreach ($id in @('CrestronHomeDevTools','CrestronHomeDevTools.Automation','CrestronHomeDevTools.SubmissionTests')) {
            dotnet nuget push "artifacts/release/$id.$env:RELEASE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed: $id" }
          }
      - name: Tag and publish GitHub release
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build modified tracked source.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$env:RELEASE_VERSION" -m "CrestronHomeDevTools v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed.' }
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Tag push failed.' }
          $assets = @(Get-ChildItem artifacts/release -File | Select-Object -ExpandProperty FullName)
          gh release create "v$env:RELEASE_VERSION" @assets --verify-tag --title "CrestronHomeDevTools v$env:RELEASE_VERSION" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }

  nuget-documentation:
    if: github.event_name == 'workflow_dispatch' && inputs.documentation_patch == true
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Build and verify documentation-only package
        shell: pwsh
        run: ./tools/New-NuGetDocumentationPatch.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-documentation-patch
          path: artifacts/nuget-documentation/*
          if-no-files-found: error
      - uses: NuGet/login@v1
        id: documentation-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish verified NuGet documentation patch
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.documentation-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem artifacts/nuget-documentation -Filter *.nupkg -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one verified package.' }
          dotnet nuget push $packages[0].FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet documentation patch publication failed.' }
