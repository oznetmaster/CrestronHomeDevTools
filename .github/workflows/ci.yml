name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PowerShell prerequisite
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: ci-validate-verify-powershell-prerequisite
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify complete discovered test coverage
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: ci-validate-verify-complete-discovered-test-coverage
      - name: Validate Windows scheduled endurance worker
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: ci-validate-validate-windows-scheduled-endurance-worker
      - name: Validate Kasa Tapo read-only endurance sample
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: ci-validate-validate-kasa-tapo-read-only-endurance-sample
      - name: Validate new monitoring directory permissions
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: ci-validate-validate-new-monitoring-directory-permissions
      - name: Validate scheduled endurance notifications
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: ci-validate-validate-scheduled-endurance-notifications
      - name: Validate completed endurance snapshots
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: ci-validate-validate-completed-endurance-snapshots
      - name: Validate passive endurance health snapshots
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: ci-validate-validate-passive-endurance-health-snapshots
      - name: Validate shared NUnit packages from a fresh cache
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: ci-validate-validate-shared-nunit-packages-from-a-fresh-cache
