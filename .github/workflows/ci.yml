name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test CrestronHomeDevTools.slnx -c Release
      - run: dotnet pack CrestronHomeDevTools/CrestronHomeDevTools.csproj -c Release --no-build -o artifacts
