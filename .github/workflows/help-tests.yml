name: Submission help builder
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/submission/requirements.txt
      - name: Install document dependencies
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: help-tests-offline-install-document-dependencies
      - name: Build offline submission validator
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: help-tests-offline-build-offline-submission-validator
      - name: Run all discovered offline document tests
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: help-tests-offline-run-all-discovered-offline-document-tests
      - name: Validate public submission workflow templates
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: help-tests-offline-validate-public-submission-workflow-templates
      - name: Build and test the Windows console download
        if: runner.os == 'Windows'
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: help-tests-offline-build-and-test-the-windows-console-download
